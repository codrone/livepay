name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changeset:
    name: Verify Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Changeset for Source Code Changes
        run: |
          SRC_CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/**')
          if [ -n "$SRC_CHANGES" ]; then
            echo "Detected changes in src/:"
            echo "$SRC_CHANGES"
            CHANGESET_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '.changeset/*.md' | grep -v '\.changeset/README\.md' || true)
            if [ -z "$CHANGESET_FILES" ]; then
              echo "::error::Pull Request modifies SDK source code in 'src/' but does not include a changeset."
              echo "Please run 'npx changeset' to generate a changeset file and commit it with your PR."
              exit 1
            fi
            echo "Changeset verification passed. Found:"
            echo "$CHANGESET_FILES"
          else
            echo "No changes in src/ detected. Skipping changeset requirement."
          fi

  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Security Dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check Package Exports & Types
        run: npm run check:exports

      - name: Run Tests with Coverage
        run: npm run test:coverage
