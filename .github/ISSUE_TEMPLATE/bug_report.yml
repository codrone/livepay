name: Bug Report
description: Create a report to help us reproduce and fix a bug in the LivePay SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or code snippets to reproduce the behavior.
      placeholder: |
        1. Initialize LivePay client with ...
        2. Call method ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node.js version, SDK version, OS (e.g. Node 20.10.0, livepay-node 1.0.0, macOS)
      placeholder: Node v20.10.0, livepay-node v1.0.0
    validations:
      required: true
