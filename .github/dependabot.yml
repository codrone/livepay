version: 2
updates:
  # Maintain dependencies for npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      vitest:
        patterns:
          - "vitest*"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
      typedoc:
        patterns:
          - "typedoc*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      changesets:
        patterns:
          - "@changesets/*"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "actions"
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
